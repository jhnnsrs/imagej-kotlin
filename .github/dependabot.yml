# Keeps the GitHub Actions pinned in .github/workflows current (one grouped PR a month).
# Gradle dependencies are deliberately NOT managed here: the ImageJ/SciJava coordinates are
# pinned to what Fiji actually ships (see CLAUDE.md), and a blind bump would break that.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  # semantic-release and its plugins (package.json). Same cadence, one grouped PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      semantic-release:
        patterns: ['*']
    ignore:
      # v10 moved to a new template engine and needs conventional-changelog-writer 9; the
      # writer @semantic-release/release-notes-generator bundles is 8, and the mismatch only
      # surfaces at release time ("Missing helper"). Stay on 9.x until the generator catches up.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ['version-update:semver-major']
