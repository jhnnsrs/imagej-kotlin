name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Full JDK 17: Gradle 8.10 cannot run on a newer JDK, and the build needs AWT present
      # (the tests boot an ImageJ context). The tests set java.awt.headless themselves, so no
      # xvfb is required.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Dependency caching + Gradle wrapper checksum validation.
      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins org.gradle.java.home to the author's machine. A command-line -D
      # outranks the project gradle.properties, so CI overrides it without touching local dev.
      # (Fallback if that precedence ever fails: append the same line to ~/.gradle/gradle.properties,
      # which also outranks the project file.)
      - name: Build, test and bundle
        run: ./gradlew build buildPlugin -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/**
          retention-days: 7

      # So a PR can be test-installed into a real Fiji before it is merged.
      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: arkitekt-plugin
          path: build/arkitekt-plugin-*.zip
          # The bundle is ~180 MB; keep it from piling up in repo storage.
          retention-days: 14
