name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a PR makes its in-flight run irrelevant. On main, runs queue instead: a
# release job must never be cancelled half-way through pushing a tag and uploading assets.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write   # "Test results" check run published by action-junit-report

jobs:
  build:
    name: Build, test and bundle
    runs-on: ubuntu-latest
    # A hung test or smoke run must not sit on the runner for days (one did: 62 h).
    # A cold run with every dependency downloaded is ~5 min; warm is ~2.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Full JDK 17: Gradle 8.10 cannot run on a newer JDK, and the build needs AWT present
      # (the tests boot an ImageJ context). The tests set java.awt.headless themselves, so no
      # xvfb is required.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Dependency caching + Gradle wrapper checksum validation + a build summary on the job.
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the dependency cache; branches and PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # gradle.properties pins org.gradle.java.home to the author's machine. A command-line -D
      # outranks the project gradle.properties (verified: it beats an invalid path there), so CI
      # overrides it without touching local dev.
      #
      # `build` runs `check`, which is the tests plus verifyShadedJar and shadedSmokeTest -- the
      # two tasks that catch a broken relocation before it surfaces inside someone's Fiji.
      - name: Build, test and bundle
        run: ./gradlew build buildPlugin -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      # Per-test pass/fail as a check run + job summary, so a red PR says which test, not
      # just "exit code 1".
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: build/test-results/test/*.xml
          check_name: Test results
          detailed_summary: true
          require_tests: false   # a compile failure produces no XML; that is already red

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

      # So a PR can be test-installed into a real Fiji before it is merged.
      - name: Upload plugin bundle
        uses: actions/upload-artifact@v7
        with:
          name: arkitekt-plugin
          path: build/arkitekt-plugin-*.zip
          # ~45 MB per run; keep it from piling up in repo storage.
          retention-days: 14
          if-no-files-found: error

  # semantic-release: derive the next version from the Conventional Commits since the last tag,
  # rebuild the plugin with that version stamped in (scripts/release-assets.sh), push the v* tag
  # and publish a GitHub Release with the jar, zip and checksums. Config: .releaserc.yml.
  # A push whose commits are all chore/docs/ci publishes nothing and the job still goes green.
  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GITHUB_TOKEN creates the tag and the release. Issue/PR commenting is disabled in
    # .releaserc.yml, so no issues/pull-requests permission is needed.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release walks the history back to the last v* tag.
          fetch-depth: 0
          # Let semantic-release authenticate with GITHUB_TOKEN from the environment rather than
          # the credentials checkout would otherwise bake into .git/config.
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true   # reuse the build job's cache, never rewrite it

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install semantic-release
        run: npm ci --no-audit --no-fund

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
