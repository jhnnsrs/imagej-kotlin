name: Release

# Two ways to cut a release, both ending in a GitHub Release with the plugin attached:
#   1. push a tag:        git tag v0.2.0 && git push origin v0.2.0
#   2. Actions > Release > "Run workflow", type the version (0.2.0). The tag is created
#      at the chosen branch's head by the release step itself.
# Either way the full build (tests, shaded-jar checks) runs first; a red build publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (a v0.2.0 tag is created on the chosen branch)'
        required: true
        type: string

# One release at a time per version; never cancel one that is half-way through publishing.
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# Needed to create the tag/release and upload the assets; no other secrets involved.
permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Resolve the version from whichever trigger fired and refuse anything that would
      # produce a misnamed or duplicate release before spending minutes on a build.
      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a semantic version (expected e.g. 0.2.0 or 0.2.0-rc1)"
            exit 1
          fi
          if [ -n "$INPUT_VERSION" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::tag v$version already exists; push it instead, or pick a new version"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (prerelease=$prerelease)"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true   # releases reuse main's cache, never rewrite it

      # -PpluginVersion stamps the version into the artifact names, so v0.2.0 produces
      # build/arkitekt-plugin-0.2.0.zip and build/libs/arkitekt-plugin-0.2.0.jar.
      # -D override of org.gradle.java.home: see the note in ci.yml.
      - name: Build, test and bundle
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ./gradlew build buildPlugin \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -PpluginVersion="$VERSION" \
            --stacktrace

      # Two forms of the same plugin plus checksums:
      #   - the bare shaded jar: drop it into Fiji.app/plugins/ (simplest install);
      #   - the zip: unpacks to Fiji.app/plugins/arkitekt/ with the marker file that
      #     `./gradlew installToImageJ` manages.
      - name: Collect release assets
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "build/arkitekt-plugin-$VERSION.zip" dist/
          cp "build/libs/arkitekt-plugin-$VERSION.jar" dist/
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          # Only consulted when the tag does not exist yet (workflow_dispatch): create it at
          # the commit this run checked out.
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.v.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            ## Installing in Fiji

            **Simplest:** download `arkitekt-plugin-${{ steps.v.outputs.version }}.jar` below and
            drop it into your Fiji installation's `plugins/` folder. Delete any older
            `arkitekt-plugin-*.jar` first, then restart Fiji. The plugin appears under
            **Plugins › Arkitekt**.

            **Alternatively** unzip `arkitekt-plugin-${{ steps.v.outputs.version }}.zip` into
            `plugins/` — it contains a single `arkitekt/` folder, so you end up with
            `Fiji.app/plugins/arkitekt/`. Remove a previous `plugins/arkitekt/` first.

            Verify a download with `sha256sum -c SHA256SUMS.txt`.

            ## Changes
