kapt.use.k2 = true

# Run the Gradle daemon on a full JDK 17. The system default `java` is OpenJDK 25, which
# Gradle 8.10 cannot run on; JDK 8/21 here are headless (no AWT) so the ImageJ GUI won't show.
# Machine-specific path (consistent with the hardcoded Fiji path in installToImageJ).
org.gradle.java.home = /usr/lib/jvm/java-17-openjdk-amd64

# Dependency-resolution hardening. maven.scijava.org (144.92.48.196, UW-Madison) is the only
# host serving net.imagej/org.scijava artifacts — they are not on Maven Central — and it
# intermittently stalls; a CI run died with "Read timed out" fetching net.imagej:imagej:2.16.0.
# A repository timeout is fatal to the whole resolution, so give that host more room and more
# attempts than the defaults (30s connect / 30s socket / 3 tentatives / 1s backoff).
# Property names are Gradle-8.10-internal: it is `max.tentatives`, NOT the `max.retries` that
# blog posts quote.
systemProp.org.gradle.internal.http.connectionTimeout = 60000
systemProp.org.gradle.internal.http.socketTimeout = 120000
systemProp.org.gradle.internal.repository.max.tentatives = 5
systemProp.org.gradle.internal.repository.initial.backoff = 1000
